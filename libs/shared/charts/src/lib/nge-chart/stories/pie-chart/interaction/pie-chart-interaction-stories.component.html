<nge-storybook-review-container
  [reviewStatus]="reviewStatus"
  [storybookFilePath]="storybookFilePath"
>
  @let outsideLabels = labelPosition() === "outside";

  <div
    class="nge-story-interaction-container"
    [class.nge-story-interaction-container--wide]="outsideLabels"
  >
    <div class="nge-story-interaction-row">
      <button
        type="button"
        class="nge-story-interaction-btn nge-story-interaction-btn--primary"
        (click)="randomizeData()"
      >
        Randomize Data
      </button>
    </div>
    @if (interactiveLegend()) {
      <!-- Standalone interactive legend placed above the chart: clicking a slice
           toggles it in/out of the pie; a toggled-off slice stays listed but dimmed
           (opacity 0.4) so it can be toggled back on. -->
      <div class="nge-story-external-legend-row">
        <span class="nge-story-external-legend-caption"
          >Standalone &lt;nge-chart-legend&gt; — click a slice to toggle it in/out of the pie</span
        >
        <nge-chart-legend
          [items]="legendItems()"
          [interactive]="true"
          swatchShape="square"
          layout="grid"
          (itemClick)="onLegendItemClick($event)"
        />
      </div>
    }
    <div
      class="nge-story-chart-wrapper"
      [class.nge-story-chart-wrapper--outside-labels]="outsideLabels"
    >
      <nge-chart [config]="config()" />
    </div>
  </div>
</nge-storybook-review-container>
