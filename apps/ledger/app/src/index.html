<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledger</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Google Analytics (GA4), property G-EQ7TZ5SH90 — deliberately the SAME
         property as jerryorta.dev. The portfolio is where visits start and this is
         where they are meant to continue, so one property keeps that journey in a
         single data set rather than three disconnected ones. Hostname-gated so local
         development never reports; mirrors `shouldEnableAnalytics` in the portfolio
         repo. GA4 enhanced measurement raises a page_view on history changes, which
         is what covers this SPA's in-app route changes. Identical copies live in
         landing/index.html and apps/storybook-app/.storybook/manager-head.html —
         change all three together. -->
    <script>
      (function () {
        var host = (window.location.hostname || '').toLowerCase();
        if (
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '::1' ||
          host.endsWith('.local')
        ) {
          return;
        }
        var id = 'G-EQ7TZ5SH90';
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', id);
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(tag);
      })();
    </script>
    <!-- Persona typefaces (Manrope/DM Sans · Literata/Nunito Sans · Epilogue/IBM
         Plex Sans) + Material Symbols for [dlcIcon]. The @nge/themes personas
         reference these families; without them icons render as ligature text
         and type falls back to system fonts. Mirrors
         apps/storybook-app/.storybook/preview.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Nunito+Sans:wght@400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body class="dlc-professional-dark">
    <ldg-root></ldg-root>
  </body>
</html>
